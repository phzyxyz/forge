# Publish public PyPI surface on version tags (Trusted Publishing).
# Tag format: v0.1.0
# Production: phzyxyz/forge · OIDC: owner/repo=phzyxyz/forge, workflow=publish.yml, env=pypi
#
# Public packages ONLY (fat forge + batteries):
#   phzyx-forge · phzyx-auth · phzyx-cache
# Built by scripts/build_pypi_release.py — never upload split monorepo packages.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build public wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Build public PyPI surface (fat forge + auth + cache)
        run: |
          set -euo pipefail
          uv run python scripts/build_pypi_release.py --clean
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Tags only — workflow_dispatch is build/artifact dry-run (no upload).
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/phzyx-forge
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
