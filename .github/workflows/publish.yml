# Publish pure-Python packages to PyPI on version tags (Trusted Publishing).
# Tag format: v0.1.0
# Configure each PyPI project with GitHub OIDC Trusted Publisher:
#   owner/repo = phzyx/phzyx, workflow = publish.yml, environment = pypi
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build wheels/sdists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Build all publishable packages
        run: |
          set -euo pipefail
          mkdir -p dist
          for name in \
            phzyx-schema \
            phzyx-engine \
            phzyx-orm \
            phzyx-admin \
            phzyx-admin-fastapi \
            phzyx-admin-litestar \
            phzyx-cli \
            phzyx-cache \
            phzyx
          do
            echo "==> $name"
            uv build --package "$name" -o dist
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/phzyx
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
