[project]
name = "phzyx-admin-litestar"
version = "0.1.0"
description = "Phzyx AdminBoard — Litestar mount adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = [
  "phzyx-admin",
  "litestar>=2.12",
]

[tool.uv.sources]
phzyx-admin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
