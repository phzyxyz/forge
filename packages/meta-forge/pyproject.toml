[project]
name = "phzyx-forge"
version = "0.1.1"
description = "Phzyx Forge — schema, failsafe migrations, ORM, AdminBoard, CLI (workspace meta; PyPI is a fat wheel)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
# Workspace / monorepo: meta package pulls split editable packages.
# PyPI upload uses scripts/build_pypi_release.py (fat wheel with vendored modules).
dependencies = [
  "phzyx-schema==0.1.1",
  "phzyx-engine==0.1.1",
  "phzyx-orm==0.1.1",
  "phzyx-admin==0.1.1",
  "phzyx-admin-fastapi==0.1.1",
  "phzyx-cli==0.1.1",
  "aiosqlite",  # full default Forge local stack (matches PyPI fat wheel)
]

[project.optional-dependencies]
sqlite = []  # alias — aiosqlite is core
postgres = ["asyncpg", "psycopg[binary]>=3"]
mysql = ["pymysql"]
mssql = ["pymssql>=2.3"]
auth = ["phzyx-auth[fastapi]"]
cache = ["phzyx-cache"]
litestar = ["phzyx-admin-litestar", "litestar>=2.12"]
# Literally full: every driver + batteries + Litestar (SQLite already in core).
full = [
  "asyncpg",
  "psycopg[binary]>=3",
  "pymysql",
  "pymssql>=2.3",
  "phzyx-auth[fastapi]",
  "phzyx-cache",
  "phzyx-admin-litestar",
  "litestar>=2.12",
]

[project.scripts]
# Entry point lives on phzyx-cli in the monorepo; fat PyPI wheel defines phzyx too.
# Keep CLI package as the workspace provider of `phzyx`.

[tool.uv.sources]
phzyx-schema = { workspace = true }
phzyx-engine = { workspace = true }
phzyx-orm = { workspace = true }
phzyx-admin = { workspace = true }
phzyx-admin-fastapi = { workspace = true }
phzyx-admin-litestar = { workspace = true }
phzyx-cli = { workspace = true }
phzyx-auth = { workspace = true }
phzyx-cache = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Dependency-only meta package (no modules). Empty wheel is intentional for monorepo.
bypass-selection = true
