[project]
name = "phzyx-orm"
version = "0.1.1"
description = "Phzyx ORM — sessions and queries over Pydantic models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = [
  "phzyx-schema",
  "phzyx-engine",
  "pydantic>=2",
]

[project.optional-dependencies]
postgres = ["asyncpg", "psycopg[binary]>=3"]
sqlite = ["aiosqlite"]
mysql = ["pymysql"]
mssql = ["pymssql>=2.3"]
# speed = ["phzyx-core"]  # M5+ optional PyO3 extension

[tool.uv.sources]
phzyx-schema = { workspace = true }
phzyx-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
