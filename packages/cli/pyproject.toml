[project]
name = "phzyx-cli"
version = "0.1.2"
description = "Forge CLI — forge command (phzyx alias)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = [
  "phzyx-schema",
  "phzyx-engine",
  "phzyx-orm",
]

[project.scripts]
forge = "phzyx.cli:main"
phzyx = "phzyx.cli:main"


[tool.uv.sources]
phzyx-schema = { workspace = true }
phzyx-engine = { workspace = true }
phzyx-orm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
