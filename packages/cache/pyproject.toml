[project]
name = "phzyx-cache"
version = "0.1.0"
description = "Phzyx versioned resource cache (memory / Redis)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
