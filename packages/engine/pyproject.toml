[project]
name = "phzyx-engine"
version = "0.1.1"
description = "Phzyx schema engine — introspect, diff, push, migrate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = [
  "phzyx-schema",
]

[project.optional-dependencies]
# Live MySQL / MariaDB (wire-compatible) connections for connect() + introspect.
mysql = ["pymysql"]
# Microsoft SQL Server (pymssql / FreeTDS).
mssql = ["pymssql>=2.3"]

[tool.uv.sources]
phzyx-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
