[project]
name = "phzyx-plugin-hello"
version = "0.1.0"
description = "Example Phzyx AdminBoard plugin (widgets + actions SPI)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "phzyx-admin",
]

[project.entry-points."phzyx.admin.widgets"]
hello_badge = "phzyx.plugin_hello.widgets:HelloBadgeWidget"

[project.entry-points."phzyx.admin.actions"]
hello_ping = "phzyx.plugin_hello.actions:hello_ping_action"

[tool.uv.sources]
phzyx-admin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
