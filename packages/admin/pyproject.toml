[project]
name = "phzyx-admin"
version = "0.1.0"
description = "Phzyx AdminBoard core — headless admin service and SPA assets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = [
  "phzyx-orm",
]

[tool.uv.sources]
phzyx-orm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
