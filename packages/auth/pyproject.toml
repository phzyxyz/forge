[project]
name = "phzyx-auth"
version = "0.1.6"
description = "Phzyx Auth — identity, sessions, JWT, API keys, RBAC. Docs: https://phzyx.xyz/forge/tutorials/auth"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
keywords = ["phzyx", "auth", "jwt", "rbac", "sessions", "fastapi"]
dependencies = [
  "phzyx-forge>=0.1.0,<0.2",
  "pydantic>=2",
  "argon2-cffi>=23",
  "PyJWT>=2.8",
]

[project.optional-dependencies]
redis = ["redis>=5"]
oauth = ["authlib>=1.3", "httpx>=0.27"]
mfa = ["pyotp>=2.9"]
webauthn = ["webauthn>=2.0"]
fastapi = ["fastapi>=0.115"]
litestar = ["litestar>=2.12"]

[project.scripts]
phzyx-auth = "phzyx.auth.cli:main"

[project.urls]
Homepage = "https://phzyx.xyz"
Documentation = "https://phzyx.xyz/forge"
"Auth tutorial" = "https://phzyx.xyz/forge/tutorials/auth"
"Getting started" = "https://phzyx.xyz/forge/getting-started"
Repository = "https://github.com/phzyxyz/forge"
Issues = "https://github.com/phzyxyz/forge/issues"

[tool.uv.sources]
phzyx-forge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
