[project]
name = "phzyx-admin-fastapi"
version = "0.1.1"
description = "Phzyx AdminBoard — FastAPI mount adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Athul Nandaswaroop" }]
dependencies = [
  "phzyx-admin",
  "fastapi>=0.115",
  "python-multipart>=0.0.32",
]

[tool.uv.sources]
phzyx-admin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phzyx"]
